# Tries the released APK on an emulator against the live demo (scripts/app-smoke.py). Its screenshots are the run's artifact.
# Run it by pushing a tag: git tag app-try-1 && git push <repo> app-try-1
name: Try the APK

on:
  push:
    tags: ["app-try-*"]

permissions:
  contents: read

jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fetch the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          gh release download -p AutoFTE.apk -D out
          ls -la out

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and use the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            adb install -r out/AutoFTE.apk
            python3 scripts/app-smoke.py out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: out/app-*.png
          retention-days: 7
